<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusSync - Real-Time Squad Availability Calendar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0a0b10',
                        cardbg: '#13151f',
                        bordercolor: '#222638'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0a0b10">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0a0b10; color: #f3f4f6; }
        .glass { background: rgba(19, 21, 31, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .neon-glow { box-shadow: 0 0 15px rgba(99, 102, 241, 0.25); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0a0b10; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #222638; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #374151; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation Header -->
    <header class="glass sticky top-0 z-50 px-4 py-3 border-b border-bordercolor">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center neon-glow text-white font-bold text-lg">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        NexusSync <span id="realm-display-badge" class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">Realm: Default</span>
                    </h1>
                    <p class="text-xs text-gray-400 flex items-center gap-1.5">
                        <span id="sync-indicator" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="sync-text">Connected to Cloud Sync</span>
                    </p>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="flex items-center gap-2 flex-wrap">
                <!-- Month Navigator -->
                <div class="flex items-center bg-cardbg border border-bordercolor rounded-xl p-1">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-800 rounded-lg text-gray-300 transition"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="current-month-year" class="px-4 font-semibold text-sm text-white">October 2026</span>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-800 rounded-lg text-gray-300 transition"><i class="fa-solid fa-chevron-right"></i></button>
                </div>

                <!-- Realm Manager Button -->
                <button onclick="openRealmModal()" class="flex items-center gap-2 px-3.5 py-2 bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 font-medium text-sm rounded-xl transition neon-glow">
                    <i class="fa-solid fa-shield-halved text-indigo-400"></i> Realm Settings
                </button>

                <!-- Roster Manager Button -->
                <button onclick="openRosterModal()" class="flex items-center gap-2 px-3.5 py-2 bg-cardbg hover:bg-gray-800 border border-bordercolor text-gray-200 font-medium text-sm rounded-xl transition">
                    <i class="fa-solid fa-users text-violet-400"></i> Manage Squad (<span id="member-count">10</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Left Sidebar: Squad Legend & Quick Stats -->
        <aside class="lg:col-span-1 space-y-6">
            <div class="glass p-5 rounded-2xl border border-bordercolor shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-white text-base flex items-center gap-2">
                        <i class="fa-solid fa-user-group text-indigo-400"></i> Squad Roster
                    </h2>
                    <button onclick="openRosterModal()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">Edit All</button>
                </div>
                <div id="roster-legend-list" class="space-y-2.5 max-h-[calc(100vh-280px)] overflow-y-auto custom-scrollbar pr-1">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </aside>

        <!-- Right Calendar Grid Container -->
        <section class="lg:col-span-3 glass rounded-2xl border border-bordercolor shadow-2xl overflow-hidden flex flex-col">
            <!-- Day Headers -->
            <div class="grid grid-cols-7 bg-cardbg/80 border-b border-bordercolor text-center text-xs font-semibold text-gray-400 py-3">
                <span class="text-rose-400">Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span class="text-indigo-400">Sat</span>
            </div>
            <!-- Calendar Days Grid -->
            <div id="calendar-grid" class="grid grid-cols-7 flex-1 auto-rows-fr bg-[#0d0f17]/50 divide-x divide-y divide-bordercolor">
                <!-- Populated dynamically -->
            </div>
        </section>
    </main>

    <!-- Roster Management Modal -->
    <div id="roster-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass max-w-lg w-full rounded-2xl border border-bordercolor p-6 shadow-2xl space-y-6">
            <div class="flex items-center justify-between border-b border-bordercolor pb-4">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-users-gear text-indigo-400"></i> Edit Squad Roster & Colors
                </h3>
                <button onclick="closeRosterModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="roster-edit-list" class="space-y-3 max-h-96 overflow-y-auto custom-scrollbar pr-2">
                <!-- Editable items -->
            </div>
            <div class="flex items-center justify-between pt-4 border-t border-bordercolor">
                <button onclick="addMember()" class="px-4 py-2 bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 font-medium text-sm rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add Squad Member
                </button>
                <button onclick="saveRosterChanges()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm rounded-xl shadow-lg transition">
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <!-- Realm / Room Settings Modal -->
    <div id="realm-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass max-w-md w-full rounded-2xl border border-bordercolor p-6 shadow-2xl space-y-6">
            <div class="flex items-center justify-between border-b border-bordercolor pb-4">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-indigo-400"></i> Realm Sync Settings
                </h3>
                <button onclick="closeRealmModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Realm Code / Room ID</label>
                    <input type="text" id="realm-input" class="w-full bg-cardbg border border-bordercolor rounded-xl px-4 py-3 text-white font-mono text-sm focus:outline-none focus:border-indigo-500 transition" placeholder="e.g. alpha-squad-2026">
                    <p class="text-xs text-gray-500 mt-1.5">Share this exact code with your friends so everyone syncs on the exact same live calendar.</p>
                </div>
                <div class="bg-indigo-950/30 border border-indigo-500/30 rounded-xl p-4 space-y-2">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-300 flex items-center gap-1.5">
                        <i class="fa-solid fa-share-nodes"></i> Share Realm Link
                    </h4>
                    <div class="flex gap-2">
                        <input type="text" id="realm-share-link" readonly class="w-full bg-cardbg/80 border border-bordercolor rounded-lg px-3 py-2 text-xs text-gray-300 font-mono">
                        <button onclick="copyRealmLink()" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs rounded-lg transition whitespace-nowrap">
                            Copy Link
                        </button>
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-4 border-t border-bordercolor">
                <button onclick="closeRealmModal()" class="px-4 py-2 bg-cardbg hover:bg-gray-800 text-gray-300 font-medium text-sm rounded-xl transition">Cancel</button>
                <button onclick="switchRealm()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm rounded-xl shadow-lg transition">Join / Switch Realm</button>
            </div>
        </div>
    </div>

    <!-- Firebase & Application Logic -->
    <script>
        // Firebase Configuration (Public demo instance / fallback store)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForNexusSyncPWA99182",
            authDomain: "nexussync-demo.firebaseapp.com",
            projectId: "nexussync-demo",
            storageBucket: "nexussync-demo.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456789"
        };

        let db;
        let isFirebaseConnected = false;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            isFirebaseConnected = true;
        } catch (e) {
            console.warn("Firebase initialization failed, falling back to local mode.", e);
        }

        // Application State
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); // 0-indexed
        let currentRealm = localStorage.getItem('nexus_realm') || 'default-squad';
        
        let squadMembers = JSON.parse(localStorage.getItem('nexus_members')) || [
            { id: 'm1', name: 'Meghna', color: '#6366f1' },
            { id: 'm2', name: 'Alex', color: '#ec4899' },
            { id: 'm3', name: 'Jordan', color: '#10b981' },
            { id: 'm4', name: 'Sam', color: '#f59e0b' },
            { id: 'm5', name: 'Taylor', color: '#8b5cf6' },
            { id: 'm6', name: 'Morgan', color: '#06b6d4' },
            { id: 'm7', name: 'Chris', color: '#f43f5e' },
            { id: 'm8', name: 'Pat', color: '#84cc16' },
            { id: 'm9', name: 'Casey', color: '#14b8a6' },
            { id: 'm10', name: 'Jamie', color: '#d946ef' }
        ];

        // Availability Data Structure: { "YYYY-MM-DD": { memberId: { available: true/false, val: number } } }
        let availabilityData = JSON.parse(localStorage.getItem(`nexus_avail_${currentRealm}`)) || {};
        let unsubscribeFirestore = null;

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('realm-input').value = currentRealm;
            document.getElementById('realm-display-badge').innerText = `Realm: ${currentRealm}`;
            updateShareLink();
            initCalendar();
            setupRealtimeSync();
        });

        function setupRealtimeSync() {
            if (!isFirebaseConnected || !db) {
                setSyncStatus(false, "Offline Mode (Local Storage)");
                renderAll();
                return;
            }

            if (unsubscribeFirestore) {
                unsubscribeFirestore();
            }

            const docRef = db.collection('realms').doc(currentRealm);
            unsubscribeFirestore = docRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.members) squadMembers = data.members;
                    if (data.availability) availabilityData = data.availability;
                    setSyncStatus(true, "Synced Live with Cloud");
                } else {
                    // Initialize realm doc if not exists
                    docRef.set({ members: squadMembers, availability: availabilityData });
                    setSyncStatus(true, "Initialized New Realm");
                }
                renderAll();
            }, (error) => {
                console.warn("Firestore permission/connection error:", error);
                setSyncStatus(false, "Offline Fallback (Permission Notice)");
                renderAll();
            });
        }

        function setSyncStatus(connected, text) {
            const indicator = document.getElementById('sync-indicator');
            const label = document.getElementById('sync-text');
            if (connected) {
                indicator.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
            } else {
                indicator.className = "w-2 h-2 rounded-full bg-amber-500";
            }
            label.innerText = text;
        }

        function saveDataToCloud() {
            localStorage.setItem('nexus_members', JSON.stringify(squadMembers));
            localStorage.setItem(`nexus_avail_${currentRealm}`, JSON.stringify(availabilityData));
            
            if (isFirebaseConnected && db) {
                db.collection('realms').doc(currentRealm).set({
                    members: squadMembers,
                    availability: availabilityData
                }, { merge: true }).catch(err => console.error("Cloud save failed:", err));
            }
        }

        function renderAll() {
            document.getElementById('member-count').innerText = squadMembers.length;
            renderLegend();
            renderCalendar();
        }

        function renderLegend() {
            const container = document.getElementById('roster-legend-list');
            container.innerHTML = squadMembers.map(m => `
                <div class="flex items-center justify-between p-2.5 rounded-xl bg-cardbg border border-bordercolor">
                    <div class="flex items-center gap-3">
                        <span class="w-3.5 h-3.5 rounded-full shadow-md" style="background-color: ${m.color}; box-shadow: 0 0 10px ${m.color}88;"></span>
                        <span class="font-medium text-sm text-gray-200">${escapeHtml(m.name)}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            document.getElementById('current-month-year').innerText = `${monthNames[currentMonth]} ${currentYear}`;
            
            grid.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevTotalDays = new Date(currentYear, currentMonth, 0).getDate();

            // Previous month padding days
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevTotalDays - i;
                grid.innerHTML += `<div class="min-h-[110px] p-2 bg-[#090a10]/40 opacity-30 text-gray-600 text-xs font-medium select-none">${dayNum}</div>`;
            }

            // Current month active days
            for (let day = 1; day <= totalDays; day++) {
                const mStr = String(currentMonth + 1).padStart(2, '0');
                const dStr = String(day).padStart(2, '0');
                const dateKey = `${currentYear}-${mStr}-${dStr}`;
                
                const dayAvail = availabilityData[dateKey] || {};

                let dotsHtml = '';
                squadMembers.forEach(m => {
                    const status = dayAvail[m.id] || { available: false, val: '' };
                    const isActive = status.available;
                    const valText = status.val !== undefined && status.val !== '' ? status.val : '';
                    
                    dotsHtml += `
                        <div class="flex items-center justify-between px-1.5 py-0.5 rounded text-[11px] hover:bg-gray-800/60 transition group cursor-pointer"
                             onclick="toggleAvailability('${dateKey}', '${m.id}')" title="${m.name}">
                            <div class="flex items-center gap-1.5 truncate">
                                <span class="w-2.5 h-2.5 rounded-full transition transform group-hover:scale-125 flex-shrink-0" 
                                      style="background-color: ${isActive ? m.color : '#222638'}; ${isActive ? `box-shadow: 0 0 8px ${m.color};` : ''}"></span>
                                <span class="truncate text-gray-300 group-hover:text-white ${isActive ? 'font-semibold' : 'opacity-60'}">${escapeHtml(m.name)}</span>
                            </div>
                            <input type="number" value="${valText}" onclick="event.stopPropagation()" onchange="updateMemberValue('${dateKey}', '${m.id}', this.value)"
                                   class="w-8 bg-cardbg border border-bordercolor rounded px-1 text-center text-xs text-white focus:outline-none focus:border-indigo-500" placeholder="-">
                        </div>
                    `;
                });

                grid.innerHTML += `
                    <div class="min-h-[130px] p-2 flex flex-col justify-between bg-cardbg/30 hover:bg-cardbg/60 transition">
                        <div class="flex items-center justify-between pb-1.5 border-b border-bordercolor/50">
                            <span class="font-bold text-xs text-gray-300">${day}</span>
                        </div>
                        <div class="space-y-1 my-1 overflow-y-auto max-h-[110px] custom-scrollbar pr-0.5">
                            ${dotsHtml}
                        </div>
                    </div>
                `;
            }
        }

        function toggleAvailability(dateKey, memberId) {
            if (!availabilityData[dateKey]) availabilityData[dateKey] = {};
            if (!availabilityData[dateKey][memberId]) {
                availabilityData[dateKey][memberId] = { available: true, val: '' };
            } else {
                availabilityData[dateKey][memberId].available = !availabilityData[dateKey][memberId].available;
            }
            saveDataToCloud();
            renderCalendar();
        }

        function updateMemberValue(dateKey, memberId, val) {
            if (!availabilityData[dateKey]) availabilityData[dateKey] = {};
            if (!availabilityData[dateKey][memberId]) {
                availabilityData[dateKey][memberId] = { available: true, val: val };
            } else {
                availabilityData[dateKey][memberId].val = val;
            }
            saveDataToCloud();
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        // Roster Modal Functions
        function openRosterModal() {
            const list = document.getElementById('roster-edit-list');
            list.innerHTML = squadMembers.map((m, idx) => `
                <div class="flex items-center gap-3 p-2.5 rounded-xl bg-cardbg border border-bordercolor">
                    <input type="color" value="${m.color}" onchange="updateMemberProp(${idx}, 'color', this.value)" class="w-8 h-8 rounded-lg bg-transparent border-0 cursor-pointer">
                    <input type="text" value="${escapeHtml(m.name)}" oninput="updateMemberProp(${idx}, 'name', this.value)" class="flex-1 bg-cardbg border border-bordercolor rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <button onclick="removeMember(${idx})" class="p-2 text-gray-500 hover:text-rose-400 transition"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('');
            document.getElementById('roster-modal').classList.remove('hidden');
        }

        function closeRosterModal() {
            document.getElementById('roster-modal').classList.add('hidden');
            renderAll();
        }

        function updateMemberProp(index, prop, val) {
            squadMembers[index][prop] = val;
        }

        function addMember() {
            const id = 'm_' + Math.random().toString(36.substring(2, 9));
            const colors = ['#6366f1', '#ec4899', '#10b981', '#f59e0b', '#8b5cf6', '#06b6d4', '#f43f5e', '#84cc16', '#14b8a6', '#d946ef'];
            const color = colors[squadMembers.length % colors.length];
            squadMembers.push({ id, name: `Member ${squadMembers.length + 1}`, color });
            openRosterModal();
        }

        function removeMember(index) {
            if (squadMembers.length <= 1) {
                alert("You must keep at least 1 squad member.");
                return;
            }
            squadMembers.splice(index, 1);
            openRosterModal();
        }

        function saveRosterChanges() {
            saveDataToCloud();
            closeRosterModal();
        }

        // Realm Modal Functions
        function openRealmModal() {
            document.getElementById('realm-input').value = currentRealm;
            updateShareLink();
            document.getElementById('realm-modal').classList.remove('hidden');
        }

        function closeRealmModal() {
            document.getElementById('realm-modal').classList.add('hidden');
        }

        function updateShareLink() {
            const code = document.getElementById('realm-input').value.trim() || 'default-squad';
            const link = `${window.location.origin}${window.location.pathname}?realm=${encodeURIComponent(code)}`;
            document.getElementById('realm-share-link').value = link;
        }

        function copyRealmLink() {
            const input = document.getElementById('realm-share-link');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert("Realm invite link copied to clipboard!");
        }

        function switchRealm() {
            const val = document.getElementById('realm-input').value.trim();
            if (!val) { alert("Please enter a valid Realm Code."); return; }
            currentRealm = val;
            localStorage.setItem('nexus_realm', currentRealm);
            document.getElementById('realm-display-badge').innerText = `Realm: ${currentRealm}`;
            closeRealmModal();
            setupRealtimeSync();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Check URL parameters for auto realm join
        const urlParams = new URLSearchParams(window.location.search);
        const realmParam = urlParams.get('realm');
        if (realmParam) {
            currentRealm = realmParam;
            localStorage.setItem('nexus_realm', currentRealm);
        }
    </script>
</body>
</html>
